# zolberg.hu – oldalszintű tartalom és cégadatok
# Szabály (master prompt 2.1): ha egy adat még nincs meg, az értéke null, és az elem nem
# jelenik meg. Helyőrző szöveget ([…]) ide ne írj: az éles build tartalom-őre elbukik rajta.
# A `pnpm build` (éles) a launch_required mezők hiányát is jelzi.

brand: zolberg

meta:
  title: 'Zolberg – céges weboldal, amit a mérés igazol' # ≤ 60 karakter
  description: 'Régi vagy lassú céges weboldalak újraépítése. Először mérek, utána tervezek, és az átadáskor a mérés mutatja meg az eredményt.' # ≤ 155 karakter

# Cégadatok (NAP): lábléc, impresszum, JSON-LD – mindenhol innen (10.)
company:
  legal_name: null # pl. a cégbejegyzés szerinti név
  owner_name: null # [Teljes név]
  address: null # székhely
  tax_id: null # adószám
  email: null
  phone: null # nemzetközi formátumban: +36 …

domains:
  brand: zolberg.hu
  sender: zolbergstudio.com

# Hero (6.2)
hero:
  status_month: null # pl. '2027. január' – csak akkor töltsd ki, ha valóban igaz

# Bizonyíték-sáv (6.3, D-009): legfeljebb 3 elem; 2-nél kevesebb valós értéknél a sáv elmarad.
# A számolt elemek a portfolio.yaml jóváhagyott munkáinak „utána” méréseiből jönnek.
proof:
  items:
    - type: portfolio_mean
      metric: psi_mobile
      label: átlagos mobil PageSpeed a munkáimon
    - type: portfolio_median
      metric: lcp_mobile
      label: medián betöltési idő (LCP) mobilon
      decimals: 1
    # - type: manual
    #   value: 12
    #   label: átadott projekt
    #   source: saját nyilvántartás
    #   measured_at: 2026-11-20

# Kapcsolat (6.9)
contact:
  response_days: null # „[X] munkanapon belül …”
