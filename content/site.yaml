# Szolgáltatás (6.5) – a szövegek jóváhagyásra várnak (OPEN_QUESTIONS B)
services:
  intro: Négy lépés, és mindegyiknek kézzelfogható eredménye van, amelyet az átadás előtt látni fog.
  items:
    - icon: measure
      title: Mérés és felmérés
      text: Megmérem a jelenlegi oldal sebességét, mobilos használhatóságát és keresőbeli alapjait.
    - icon: design
      title: Egyedi terv
      text: A cég kínálatára és az ajánlatkérés útjára szabott terv, sablon nélkül.
    - icon: build
      title: Gyors, mobilbarát építés
      text: Könnyű, gyorsan betöltő oldal, amely telefonon is ugyanolyan jól használható.
    - icon: handover
      title: Átadás és karbantartás
      text: Az átadáskor újramérek, és az eredményt a kiinduló méréssel együtt adom át.

# Folyamat (6.6) – az időkeret ([X] nap/hét) csak akkor jelenik meg, ha kitöltöd
process:
  steps:
    - title: Mérés
      text: Lemérem a jelenlegi oldalt, és rövid, forrással ellátott összefoglalót küldök róla.
      duration: null
    - title: Terv
      text: Megmutatom, hogyan épül fel az új oldal, és mi változik az ajánlatkérés útján.
      duration: null
    - title: Építés
      text: Elkészítem az oldalt, és a megbeszélt időpontokban megmutatom, hol tart.
      duration: null
    - title: Átadás
      text: Újramérek, összevetem az eredményt a kiinduló állapottal, és átadom az oldalt.
      duration: null

# Rólam (6.7) – név a company.owner_name-ből; portré: content/about/<fájl> (4:5)
