# Folyamat (6.6) – az időkeret ([X] nap/hét) csak akkor jelenik meg, ha kitöltöd
process:
  steps:
    - title: Mérés
      text: Lemérem a jelenlegi oldalt, és rövid, forrással ellátott összefoglalót küldök róla.
      duration: 2–3 munkanap
    - title: Terv
      text: Megmutatom, hogyan épül fel az új oldal, és mi változik az ajánlatkérés útján.
      duration: 1 hét
    - title: Építés
      text: Elkészítem az oldalt, és a megbeszélt időpontokban megmutatom, hol tart.
      duration: 2–4 hét
    - title: Átadás
      text: Újramérek, összevetem az eredményt a kiinduló állapottal, és átadom az oldalt.
      duration: 1 munkanap

