# GYIK (6.8) – az ár-kérdés csak a pricing-döntés után kerül be
faq:
  - q: Mennyi idő alatt készül el az oldal?
    a: Az időkeretet a mérés és a terv után írásban rögzítem. Addig nem ígérek dátumot, mert az a meglévő tartalomtól és a döntések ütemétől függ.
  - q: Ki adja a szövegeket és a képeket?
    a: A meglévő szövegekből és képekből indulok ki. Ahol valami hiányzik vagy elavult, jelzem, és megbeszéljük, ki készíti el.
  - q: Mi lesz a keresőbeli helyezéssel és a régi linkekkel?
    a: A régi címek 301-es átirányítással az új oldalakra visznek, így a meglévő találatok és hivatkozások nem vesznek el. Helyezést nem ígérek, mert azt nem én döntöm el.
  - q: Kié lesz az elkészült oldal?
    a: Az oldal és a forráskódja a cégé. A domain és a tárhely az Ön nevén van, vagy oda kerül.
  - q: Ki tartja karban az oldalt az átadás után?
    a: Az oldal karbantartás nélkül is működik. Ha szeretné, a frissítésekről és a mérések megismétléséről külön állapodunk meg.
